services:

  nopcommerce_web:
    build: .
    container_name: nopcommerce

    ports:
      - "5000:80"

    depends_on:
      - nopcommerce_database

    networks:
      - nopnetwork
    
    volumes:
      - nopcommerce_data:/app/App_Data

  nopcommerce_database:
    image: "mcr.microsoft.com/mssql/server:2019-latest"
    container_name: nopcommerce_mssql_server

    environment:
      SA_PASSWORD: "NopCommerce@123"
      ACCEPT_EULA: "Y"
      MSSQL_PID: "Express"

    volumes:
      - mssql_data:/var/opt/mssql

    networks:
      - nopnetwork

networks:
  nopnetwork:

volumes:
  nopcommerce_data:
  mssql_data:
